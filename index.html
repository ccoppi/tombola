<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tombola del Sabato Sera</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f4f4f9; color: #333; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #d32f2f; }
        #ultimo-estratto { font-size: 80px; font-weight: bold; color: #d32f2f; margin: 20px 0; min-height: 100px; }
        button { background-color: #d32f2f; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #b71c1c; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #lista-estratti { margin-top: 30px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .numero-piccolo { background: #eee; padding: 10px; border-radius: 5px; min-width: 30px; font-weight: bold; animation: fadeIn 0.5s; }
        .nuovo { background: #ffeb3b; border: 2px solid #d32f2f; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <h1>Tombola in Famiglia 🏠</h1>
    <div id="ultimo-estratto">--</div>
    <button id="btn-estrai" onclick="estraiNumero()">Estrai Numero</button>
    <button onclick="resetGioco()" style="background-color: #555; margin-left: 10px;">Reset</button>

    <div id="lista-estratti">
        </div>
</div>

<script>
    let numeriDisponibili = Array.from({length: 90}, (_, i) => i + 1);
    let numeriEstratti = [];

    function estraiNumero() {
        if (numeriDisponibili.length === 0) {
            alert("Tutti i numeri sono stati estratti!");
            return;
        }

        // Estrazione casuale
        const indiceRandom = Math.floor(Math.random() * numeriDisponibili.length);
        const numero = numeriDisponibili.splice(indiceRandom, 1)[0];
        
        numeriEstratti.unshift(numero); // Aggiunge in cima alla lista

        aggiornaInterfaccia(numero);
    }

    function aggiornaInterfaccia(ultimo) {
        document.getElementById('ultimo-estratto').innerText = ultimo;
        const containerLista = document.getElementById('lista-estratti');
        
        // Creazione visiva della lista (ordine inverso)
        containerLista.innerHTML = numeriEstratti.map((n, index) => 
            `<div class="numero-piccolo ${index === 0 ? 'nuovo' : ''}">${n}</div>`
        ).join('');

        if (numeriDisponibili.length === 0) {
            document.getElementById('btn-estrai').disabled = true;
        }
    }

    function resetGioco() {
        if (confirm("Vuoi davvero ricominciare da capo?")) {
            numeriDisponibili = Array.from({length: 90}, (_, i) => i + 1);
            numeriEstratti = [];
            document.getElementById('ultimo-estratto').innerText = "--";
            document.getElementById('lista-estratti').innerHTML = "";
            document.getElementById('btn-estrai').disabled = false;
        }
    }
</script>

</body>
</html>
