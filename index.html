<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tombola Mobile</title>
    <style>
        :root { --primary: #d32f2f; --bg: #1a1a1a; --card: #2d2d2d; --text: #eee; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; height: 100vh; box-sizing: border-box; }
        
        /* Area Numero Estratto */
        .estrazione-container { width: 100%; text-align: center; margin-bottom: 15px; }
        #ultimo-estratto { font-size: 100px; font-weight: 900; color: var(--primary); line-height: 1; margin: 10px 0; text-shadow: 0 0 20px rgba(211, 47, 47, 0.3); }
        
        .controlli { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        button { background: var(--primary); color: white; border: none; padding: 15px 25px; font-size: 18px; border-radius: 12px; font-weight: bold; cursor: pointer; flex-grow: 1; max-width: 200px; }
        .btn-reset { background: #444; width: 60px; flex-grow: 0; }
        button:active { transform: scale(0.95); }

        /* Griglia Tabellone per Decine */
        .tabellone { width: 100%; display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; background: #000; padding: 5px; border-radius: 8px; overflow-y: auto; }
        .cella { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: var(--card); font-size: 12px; border-radius: 4px; color: #555; transition: 0.3s; border: 1px solid #3d3d3d; }
        .cella.estratto { background: var(--primary); color: white; font-weight: bold; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); border-color: transparent; }
        
        /* Evidenzia l'ultimo in modo speciale nel tabellone */
        .cella.ultimo { background: #ffeb3b; color: #000; transform: scale(1.1); z-index: 2; }

        @media (max-width: 400px) {
            #ultimo-estratto { font-size: 80px; }
            .cella { font-size: 10px; }
        }
    </style>
</head>
<body>

    <div class="estrazione-container">
        <div id="ultimo-estratto">--</div>
        <div class="controlli">
            <button onclick="estraiNumero()">ESTRAI</button>
            <button class="btn-reset" onclick="resetGioco()">↺</button>
        </div>
    </div>

    <div class="tabellone" id="tabellone">
        </div>

<script>
    let numeriDisponibili = Array.from({length: 90}, (_, i) => i + 1);
    let numeriEstratti = [];

    // Inizializza il tabellone visivo
    function creaTabellone() {
        const tab = document.getElementById('tabellone');
        tab.innerHTML = '';
        for (let i = 1; i <= 90; i++) {
            const div = document.createElement('div');
            div.className = 'cella';
            div.id = `num-${i}`;
            div.innerText = i;
            tab.appendChild(div);
        }
    }

    function estraiNumero() {
        if (numeriDisponibili.length === 0) {
            alert("Tabellone completo!");
            return;
        }

        const indice = Math.floor(Math.random() * numeriDisponibili.length);
        const numero = numeriDisponibili.splice(indice, 1)[0];
        numeriEstratti.push(numero);

        aggiornaUI(numero);
    }

    function aggiornaUI(ultimo) {
        // Aggiorna il numerone centrale
        document.getElementById('ultimo-estratto').innerText = ultimo;

        // Rimuovi classe "ultimo" dal precedente
        document.querySelectorAll('.cella.ultimo').forEach(el => el.classList.remove('ultimo'));

        // Segna il numero sul tabellone
        const cella = document.getElementById(`num-${ultimo}`);
        cella.classList.add('estratto', 'ultimo');
        
        // Scroll automatico se necessario (per schermi molto piccoli)
        cella.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function resetGioco() {
        if (confirm("Vuoi svuotare il tabellone?")) {
            numeriDisponibili = Array.from({length: 90}, (_, i) => i + 1);
            numeriEstratti = [];
            document.getElementById('ultimo-estratto').innerText = "--";
            creaTabellone();
        }
    }

    // Partenza
    creaTabellone();
</script>

</body>
</html>
